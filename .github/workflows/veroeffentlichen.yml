# Veröffentlicht den Ordner website/ bei jedem Push auf main über GitHub Pages.
# Nur website/ geht online — werkzeuge/, README usw. bleiben draußen.
name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/veroeffentlichen.yml']
  workflow_dispatch: # erlaubt manuelles Starten unter „Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
